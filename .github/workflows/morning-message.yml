name: Morning Teams Message

on:
  schedule:
    # 9 AM Lisbon time (UTC+1 winter / UTC+2 summer)
    # Adjust hour: use 8 for winter (UTC+1), 7 for summer (UTC+2)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: python send_once.py
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
